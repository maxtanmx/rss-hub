name: RSS Hub

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you click "Run workflow" manually

# Never run two checks at the same time (they would both send the same articles).
concurrency:
  group: rss-hub
  cancel-in-progress: false

permissions:
  contents: write             # needed to save seen.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: python rss_hub.py

      - name: Save which articles were sent
        if: always()
        run: |
          git config user.name "rss-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen articles" && git push)
